{% extends 'base.html' %}
{% block title %}{{ t('setup_title') }} · {{ t('app_name') }}{% endblock %}
{% block content %}
<div class="auth-wrap">
  <form class="card auth-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="auth-logo"><img src="{{ url_for('static', filename='img/logo.svg') }}" width="56" height="56" alt=""></div>
    <h1>{{ t('setup_title') }}</h1>
    <p class="muted">{{ t('setup_sub') }}</p>
    <label class="field"><span>{{ t('full_name') }}</span><input type="text" name="name" required maxlength="100" value="{{ request.form.get('name', '') }}"></label>
    <label class="field"><span>{{ t('username') }}</span><input type="text" name="username" required maxlength="80" autocapitalize="none" dir="auto" value="{{ request.form.get('username', 'admin') }}"></label>
    <label class="field"><span>{{ t('password') }}</span><input type="password" name="password" required minlength="6" dir="ltr" autocomplete="new-password"></label>
    <button class="btn primary block lg" type="submit">{{ t('setup_button') }}</button>
  </form>
</div>
{% endblock %}
